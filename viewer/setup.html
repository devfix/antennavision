<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Setup Verification</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; }
        canvas { display: block; }
        #info {
            position: absolute; top: 10px; left: 10px; color: white;
            font-family: sans-serif; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 5px;
        }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
        const script = document.createElement('script');
        script.type = 'module';
        script.src = 'app.js?t=' + Date.now();  // "Cache Busting" to force the browser to reload the file every time
        document.head.appendChild(script);
    </script>
</head>
<body>
    <div id="info">Left Click + Drag to Rotate | Right Click + Drag to Pan | Scroll to Zoom</div>
</body>
</html>
